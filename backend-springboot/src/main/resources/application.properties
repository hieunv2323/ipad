# Server Configuration
server.port=8080
server.servlet.context-path=/

# =======================================================
# EMBEDDED H2 DATABASE (Persistent File Storage - Auto SQL Server Mode)
# =======================================================
spring.datasource.url=jdbc:h2:file:./data/bananastore_db;MODE=MSSQLServer;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =======================================================
# MICROSOFT SQL SERVER CONFIGURATION (Uncomment when running real SQL Server)
# =======================================================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BananaIpadStore;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Performance & Compression Settings
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
spring.jpa.open-in-view=false

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Gemini AI Integration Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

